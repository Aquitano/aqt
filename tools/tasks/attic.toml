["attic:check"]
depends = ["shared:ts", "shared:go", "attic:ts", "attic:go", "attic:go:unix", "attic:go:windows"]

["attic:ts"]
run = [
  "bunx --no-install vp check apps/attic/executor",
  "bun run --cwd apps/attic/executor typecheck",
]

["attic:go"]
dir = "apps/attic"
run = ["go vet ./...", "go test -race ./...", "golangci-lint run"]
# The race detector needs cgo, which Windows only has with a C compiler installed.
run_windows = ["go vet ./...", "go test ./...", "golangci-lint run"]

["attic:go:unix"]
description = "Vet and lint the Linux build"
dir = "apps/attic"
env = { GOOS = "linux" }
run = ["go vet ./...", "golangci-lint run"]

["attic:go:windows"]
description = "Vet and lint the Windows build, where scanning runs"
dir = "apps/attic"
env = { GOOS = "windows" }
run = ["go vet ./...", "golangci-lint run"]

["attic:db"]
description = "Start attic's ParadeDB"
dir = "apps/attic"
run = "docker compose up -d --wait"
