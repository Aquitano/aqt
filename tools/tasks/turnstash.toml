["turnstash:check"]
depends = ["shared:ts", "turnstash:ts"]

["turnstash:ts"]
description = "Lint, format check, typecheck and test turnstash; the server tests need turnstash:db"
run = [
  "bunx --no-install oxlint --type-aware apps/turnstash",
  "bunx --no-install oxfmt --check apps/turnstash",
  "bun run --filter \"@aqt/turnstash*\" typecheck",
  "bun run --cwd apps/turnstash test",
]

["turnstash:db"]
description = "Start the dev database on 5437 and the disposable test database on 5434"
dir = "apps/turnstash"
run = "docker compose -p turnstash-dev -f deploy/docker-compose.dev.yml --profile test up -d --wait db db-test"

["turnstash:dev"]
description = "Run the server on 4320 and the web UI with hot reload against the dev database"
dir = "apps/turnstash"
env = { DATABASE_URL = "postgres://turnstash:turnstash@localhost:5437/turnstash", ADMIN_TOKEN = "dev" }
run = "bun run --filter @aqt/turnstash-server --filter @aqt/turnstash-web dev"
