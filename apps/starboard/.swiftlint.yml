included:
  - Starboard
  - Packages/StarboardCore/Sources
  - Packages/StarboardCore/Tests
excluded:
  - DerivedData
  - Starboard.xcodeproj
  - Packages/StarboardCore/.build
line_length:
  warning: 120
  ignores_comments: true
  ignores_urls: true
type_body_length:
  warning: 350
file_length:
  warning: 500
identifier_name:
  min_length: 2
disabled_rules:
  - trailing_comma
  - todo
reporter: xcode
# Intent and key dispatch are one switch over every case.
cyclomatic_complexity:
  ignores_case_statements: true
