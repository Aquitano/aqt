services:
  db:
    image: paradedb/paradedb:v0.26.1-pg17@sha256:c1c147499c6649739d7977f1e47db149578c894f35249953acdd7680ccbae75b
    # The image sizes shared_buffers to 25% of the host's RAM; a personal archive needs far less.
    command: ["postgres", "-c", "shared_buffers=256MB"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnstash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-turnstash}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    image: ${SERVER_IMAGE:-ghcr.io/aquitano/aqt-turnstash-server:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-turnstash}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-turnstash}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_SUBJECT: ${OIDC_ADMIN_SUBJECT:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      PRICING_REFRESH_HOURS: ${PRICING_REFRESH_HOURS:-24}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-2000}
      NORMALIZE_SETTLE_MS: ${NORMALIZE_SETTLE_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      PORT: "4320"
    ports:
      - "127.0.0.1:${SERVER_PORT:-4320}:4320"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:4320/api/health'); process.exit(response.ok && (await response.json()).ok === true ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

volumes:
  db-data:
