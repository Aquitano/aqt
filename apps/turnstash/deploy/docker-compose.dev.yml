services:
  db:
    image: paradedb/paradedb:v0.26.1-pg17@sha256:c1c147499c6649739d7977f1e47db149578c894f35249953acdd7680ccbae75b
    environment:
      POSTGRES_USER: turnstash
      POSTGRES_PASSWORD: turnstash
      POSTGRES_DB: turnstash
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql/data

  db-test:
    image: paradedb/paradedb:v0.26.1-pg17@sha256:c1c147499c6649739d7977f1e47db149578c894f35249953acdd7680ccbae75b
    profiles: [test]
    environment:
      POSTGRES_USER: turnstash
      POSTGRES_PASSWORD: turnstash
      POSTGRES_DB: turnstash_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-dev-data:
