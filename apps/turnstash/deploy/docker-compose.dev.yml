services:
  db:
    image: paradedb/paradedb:v0.26.5-pg17@sha256:af82b608d85fccc315dcaa65fdeef63c94837906bb7984f378ab645c8d4e81b8
    environment:
      POSTGRES_USER: turnstash
      POSTGRES_PASSWORD: turnstash
      POSTGRES_DB: turnstash
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql/data

  db-test:
    image: paradedb/paradedb:v0.26.5-pg17@sha256:af82b608d85fccc315dcaa65fdeef63c94837906bb7984f378ab645c8d4e81b8
    profiles: [test]
    environment:
      POSTGRES_USER: turnstash
      POSTGRES_PASSWORD: turnstash
      POSTGRES_DB: turnstash_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-dev-data:
