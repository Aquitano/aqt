services:
  db:
    image: paradedb/paradedb:v0.26.6-pg17@sha256:d2793a65990a7179c97835cc8fc546f8f8bb3a2df975d80194f35e1744fd49be
    environment:
      POSTGRES_USER: turnstash
      POSTGRES_PASSWORD: turnstash
      POSTGRES_DB: turnstash
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql/data

  db-test:
    image: paradedb/paradedb:v0.26.6-pg17@sha256:d2793a65990a7179c97835cc8fc546f8f8bb3a2df975d80194f35e1744fd49be
    profiles: [test]
    environment:
      POSTGRES_USER: turnstash
      POSTGRES_PASSWORD: turnstash
      POSTGRES_DB: turnstash_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-dev-data:
