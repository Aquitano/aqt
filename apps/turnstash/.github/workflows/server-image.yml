name: build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: paradedb/paradedb:0.25.9-pg17
        env:
          POSTGRES_USER: turnstash
          POSTGRES_PASSWORD: turnstash
          POSTGRES_DB: turnstash_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U turnstash -d turnstash_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun test
        env:
          TEST_DATABASE_URL: postgres://turnstash:turnstash@localhost:5433/turnstash_test
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'import pkg from "./apps/agent/package.json"; if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag must match the agent package version")'
      - name: Package and verify the standalone agent
        run: |
          mkdir -p dist
          bun pm --cwd apps/agent pack --filename "$PWD/dist/turnstash.tgz"
          cp apps/agent/dist/turnstash.js dist/turnstash.js
          package_test_dir=$(mktemp -d)
          printf '{"private":true,"dependencies":{"@aqt/turnstash":"file:%s/dist/turnstash.tgz"}}\n' "$PWD" > "$package_test_dir/package.json"
          bun install --cwd "$package_test_dir" --offline
          TURNSTASH_CONFIG_DIR="$package_test_dir/config" TURNSTASH_STATE_DIR="$package_test_dir/state" "$package_test_dir/node_modules/.bin/turnstash" --help
          cd dist
          sha256sum turnstash.js turnstash.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: |
            dist/turnstash.js
            dist/turnstash.tgz
            dist/SHA256SUMS
          if-no-files-found: error

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the production stack from source
        env:
          POSTGRES_PASSWORD: ci-disposable-password
          ADMIN_TOKEN: ci-disposable-token
          SERVER_IMAGE: turnstash-ci:local
        run: docker compose -p turnstash-ci -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml up --build --wait --wait-timeout 180
      - name: Check the running image
        run: |
          curl --fail http://127.0.0.1:4320/api/health
          curl --fail http://127.0.0.1:4320/ | grep 'id="root"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4320/api/stats)" = 401
          curl --fail --header 'Authorization: Bearer ci-disposable-token' http://127.0.0.1:4320/api/stats
      - name: Stop the disposable stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-disposable-password
          ADMIN_TOKEN: ci-disposable-token
          SERVER_IMAGE: turnstash-ci:local
        run: docker compose -p turnstash-ci -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml down --volumes

  publish:
    needs: container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: dist
      - name: Publish the agent release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/turnstash.js dist/turnstash.tgz dist/SHA256SUMS --verify-tag --generate-notes
