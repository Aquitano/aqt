apiVersion: 1

datasources:
  - name: Prometheus
    uid: tracker-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s

  - name: tracker Postgres
    uid: tracker-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: tracker
    database: tracker
    isDefault: true
    secureJsonData:
      password: tracker
    jsonData:
      database: tracker
      sslmode: disable
