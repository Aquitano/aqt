apiVersion: 1

datasources:
  - name: tracker Postgres
    uid: tracker-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: tracker
    database: tracker
    isDefault: true
    secureJsonData:
      # Grafana expands this from its own environment, which docker-compose.yml
      # fills from .env.
      password: $POSTGRES_PASSWORD
    jsonData:
      database: tracker
      sslmode: disable
