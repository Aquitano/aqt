# ParadeDB (Postgres + pg_search) plus the stack the dashboards are read from.
# Laptop-local development: every port is bound to 127.0.0.1, nothing is exposed.
#
# `tracker serve` is not in here. It runs natively on the host, so Prometheus
# scrapes it through host.docker.internal rather than over the compose network.
# The project name would otherwise be the directory: "deploy".
name: tracker

services:
  db:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # Postgres 18+ images want the mount at /var/lib/postgresql (not .../data)
      - tracker-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tracker-prometheus:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    extra_hosts:
      # Resolves to the host running docker, where `tracker serve` listens.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.4.3
    environment:
      # Loopback only, one user: a login screen would be pure friction.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - tracker-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3090:3000"
    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  tracker-pgdata:
  tracker-prometheus:
  tracker-grafana:
