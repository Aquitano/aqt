# The laptop, on top of ../docker-compose.yml. From apps/tracker:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.laptop.yml up -d
#
# `tracker serve` runs natively here (README: Always on), so this adds
# Prometheus to scrape it through host.docker.internal, the Grafana dashboard
# that reads Prometheus, anonymous Grafana, and the restart policies that bring
# the stack back with Docker Desktop. Every port stays on 127.0.0.1.
#
# Paths resolve against apps/tracker, the first file's directory, not this one.
services:
  db:
    restart: unless-stopped

  backup:
    volumes:
      # On the host, where Time Machine can version it.
      - ${TRACKER_BACKUP_DIR:-${HOME}/Library/Application Support/tracker/backups}:/backups
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tracker-prometheus:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    extra_hosts:
      # Resolves to the host running docker, where `tracker serve` listens.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    environment:
      # Loopback only, one user: a login screen would be pure friction.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./deploy/grafana/dashboards/prometheus:/etc/grafana/dashboards/prometheus:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  tracker-prometheus:
