# The API server only. Postgres (Neon), media (R2) and identity (Clerk) are
# external services, and the web app runs on Vercel.
#
# .env here is the file `ops/secrets.sh send gallery prod` writes; compose also
# reads it for the interpolation below.
services:
  server:
    build:
      context: ../../../..
      dockerfile: apps/gallery/apps/server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: aqt-gallery-server:local
    env_file: .env
    ports:
      # Loopback by default; the reverse proxy on the box terminates TLS.
      - "${AQT_GALLERY_LISTEN:-127.0.0.1:3000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
