<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bank</title>
<style>
  :root {
    --bg: #0e0e12;
    --panel: #16161c;
    --panel-2: #1c1c24;
    --border: #26262f;
    --text: #e6e6ea;
    --muted: #8f8f9c;
    --faint: #5c5c68;
    --accent: #8ab4f8;
    --accent-dim: #8ab4f822;
    --mark: #f5c97b;
    --me: #1e2a3d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 1.25rem;
    padding: .65rem 1.25rem; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  header h1 { font-size: .95rem; font-weight: 650; letter-spacing: .04em; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: .25rem; }
  nav button {
    background: none; border: none; color: var(--muted); font: inherit;
    padding: .35rem .8rem; border-radius: 6px; cursor: pointer;
  }
  nav button:hover { color: var(--text); }
  nav button.active { background: var(--accent-dim); color: var(--accent); }
  #totals { margin-left: auto; color: var(--faint); font-size: .8rem; }

  main { flex: 1; display: flex; min-height: 0; }
  #list-pane {
    width: 44%; min-width: 380px; max-width: 560px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); min-height: 0;
  }
  #detail-pane { flex: 1; overflow-y: auto; min-height: 0; background: var(--bg); }

  #controls { padding: .9rem 1rem .6rem; display: flex; flex-direction: column; gap: .5rem; flex-shrink: 0; }
  #controls .row { display: flex; gap: .5rem; }
  input, select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: .45rem .65rem; font: inherit; min-width: 0;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  #q { flex: 1; }
  #controls .row.filters > * { flex: 1; font-size: .82rem; color: var(--muted); }
  input[type=date] { color-scheme: dark; }

  #results { flex: 1; overflow-y: auto; padding: 0 .5rem .5rem; }
  .hit {
    padding: .6rem .65rem; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .hit:hover { background: var(--panel); }
  .hit.selected { background: var(--panel-2); border-color: var(--border); }
  .hit .top { display: flex; align-items: baseline; gap: .5rem; }
  .hit .sender { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hit .date { margin-left: auto; color: var(--faint); font-size: .75rem; white-space: nowrap; }
  .hit .subject { font-size: .82rem; color: var(--text); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hit .snippet { color: var(--muted); font-size: .82rem; margin-top: .1rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hit .snippet.att::before { content: "in attachment · "; color: var(--faint); font-style: italic; }
  mark { background: none; color: var(--mark); font-weight: 600; }

  .badge {
    font-size: .68rem; font-weight: 650; padding: .1rem .45rem; border-radius: 99px;
    letter-spacing: .03em; flex-shrink: 0; border: 1px solid;
  }
  .empty { color: var(--faint); text-align: center; padding: 3rem 1rem; }
  .more {
    width: calc(100% - .3rem); margin: .4rem .15rem; padding: .5rem; background: var(--panel);
    color: var(--muted); border: 1px solid var(--border); border-radius: 8px; font: inherit; cursor: pointer;
  }
  .more:hover { color: var(--text); }

  /* detail pane */
  #detail { max-width: 860px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }
  #detail .thread-head {
    position: sticky; top: 0; background: var(--bg); padding: .5rem 0 .75rem;
    border-bottom: 1px solid var(--border); margin-bottom: 1rem;
    display: flex; align-items: baseline; gap: .6rem;
  }
  #detail .thread-head .name { font-weight: 650; font-size: 1.02rem; }
  #detail .thread-head .meta { color: var(--faint); font-size: .78rem; margin-left: auto; }
  .msg { margin-bottom: .9rem; max-width: 78%; }
  .msg.me { margin-left: auto; }
  .msg .who { font-size: .75rem; color: var(--muted); margin: 0 .25rem .15rem; display: flex; gap: .5rem; }
  .msg.me .who { justify-content: flex-end; }
  .msg .who .t { color: var(--faint); }
  .msg .bubble {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: .5rem .75rem; white-space: pre-wrap; word-break: break-word;
  }
  .msg.me .bubble { background: var(--me); border-color: #2a3a52; }
  .msg.flash .bubble { border-color: var(--mark); }
  .msg .subj { font-weight: 650; margin-bottom: .3rem; }
  .attachments { margin-top: .4rem; display: flex; flex-wrap: wrap; gap: .35rem; }
  .attachments a {
    color: var(--accent); text-decoration: none; font-size: .78rem;
    background: var(--accent-dim); padding: .15rem .5rem; border-radius: 6px;
  }
  .day-sep { text-align: center; color: var(--faint); font-size: .72rem; margin: 1.1rem 0 .8rem; }

  /* stats + contacts */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .8rem; padding: 1.25rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: .9rem 1rem; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card .n { font-size: 1.5rem; font-weight: 700; margin: .15rem 0; }
  .card .sub { color: var(--muted); font-size: .78rem; }
  .contact-row {
    display: flex; align-items: baseline; gap: .6rem; padding: .55rem .65rem;
    border-radius: 8px; cursor: pointer;
  }
  .contact-row:hover { background: var(--panel); }
  .contact-row .aliases { color: var(--faint); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<header>
  <h1><span>aqt</span>-bank</h1>
  <nav>
    <button data-view="search" class="active">Search</button>
    <button data-view="browse">Browse</button>
    <button data-view="contacts">Contacts</button>
    <button data-view="stats">Stats</button>
  </nav>
  <div id="totals"></div>
</header>
<main>
  <div id="list-pane">
    <div id="controls"></div>
    <div id="results"></div>
  </div>
  <div id="detail-pane"><div id="detail"><div class="empty">Select a message</div></div></div>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const SOURCE_HUES = { whatsapp: 130, gmail: 10, proton: 270, discord: 235, linkedin: 205, chatgpt: 170, claude: 25, "claude-code": 40 };
function badge(src) {
  const h = SOURCE_HUES[src] ?? (Array.from(src).reduce((a, c) => a + c.charCodeAt(0), 0) * 37) % 360;
  return `<span class="badge" style="color:hsl(${h} 60% 70%);border-color:hsl(${h} 40% 35%);background:hsl(${h} 50% 60% / .08)">${esc(src)}</span>`;
}

const ME = /thomas breindl|breindlthomas/i;
const isMe = sender => ME.test(sender || "");

const fmtDay = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const fmtTime = d => new Date(d).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const fmtDate = d => { const t = new Date(d), now = new Date();
  return t.toDateString() === now.toDateString() ? fmtTime(d)
    : t.getFullYear() === now.getFullYear() ? t.toLocaleDateString("en-GB", { day: "numeric", month: "short" })
    : t.toLocaleDateString("en-GB", { month: "short", year: "numeric" }); };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

let stats = [], view = "search", offset = 0, lastItems = [];

/* ---------- list pane rendering ---------- */

function highlight(text, query) {
  let html = esc(text);
  for (const w of (query || "").split(/\s+/).filter(w => w.length > 1)) {
    html = html.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  }
  return html;
}

function renderHits(items, { query = "", append = false, more = false } = {}) {
  const box = $("#results");
  const html = items.map((m, i) => `
    <div class="hit" data-i="${(append ? lastItems.length : 0) + i}">
      <div class="top">${badge(m.source)}<span class="sender">${esc(m.sender || "—")}</span>
        <span class="date">${fmtDate(m.sent_at)}</span></div>
      ${m.subject ? `<div class="subject">${highlight(m.subject, query)}</div>` : ""}
      <div class="snippet${m.attachment_snippet ? " att" : ""}">${highlight(m.attachment_snippet || m.snippet || m.body || "", query)}</div>
    </div>`).join("");
  if (append) { box.querySelector(".more")?.remove(); box.insertAdjacentHTML("beforeend", html); lastItems.push(...items); }
  else { box.innerHTML = html || `<div class="empty">No results</div>`; box.scrollTop = 0; lastItems = items; }
  if (more) box.insertAdjacentHTML("beforeend", `<button class="more">Load more</button>`);
}

$("#results").addEventListener("click", e => {
  const moreBtn = e.target.closest(".more");
  if (moreBtn) return loadMore();
  const hit = e.target.closest(".hit");
  if (!hit) return;
  document.querySelectorAll(".hit.selected").forEach(el => el.classList.remove("selected"));
  hit.classList.add("selected");
  const m = lastItems[+hit.dataset.i];
  if (view === "contacts" && m.name !== undefined) return openContact(m);
  openMessage(m);
});

/* ---------- detail pane ---------- */

function msgHTML(m, flashId) {
  const att = (m.attachments || []).map(a =>
    `<a href="/v1/blobs/${a.sha256}" download="${esc(a.filename)}">📎 ${esc(a.filename)}</a>`).join("");
  return `<div class="msg${isMe(m.sender) ? " me" : ""}${m.id === flashId ? " flash" : ""}" data-id="${m.id}">
    <div class="who"><span>${esc(m.sender || "—")}</span><span class="t">${fmtTime(m.sent_at)}</span></div>
    <div class="bubble">${m.subject ? `<div class="subj">${esc(m.subject)}</div>` : ""}${esc(m.body || "")}${att ? `<div class="attachments">${att}</div>` : ""}</div>
  </div>`;
}

function renderConversation(title, meta, messages, flashId) {
  let html = `<div class="thread-head"><span class="name">${title}</span><span class="meta">${esc(meta)}</span></div>`;
  let day = "";
  for (const m of messages) {
    const d = fmtDay(m.sent_at);
    if (d !== day) { day = d; html += `<div class="day-sep">${d}</div>`; }
    html += msgHTML(m, flashId);
  }
  $("#detail").innerHTML = html;
  const target = flashId && $(`#detail .msg[data-id="${flashId}"]`);
  (target || $("#detail-pane")).scrollIntoView?.call(target || $("#detail"), { block: "center" });
  if (!target) $("#detail-pane").scrollTop = $("#detail-pane").scrollHeight;
}

async function openMessage(m) {
  try {
    if (m.thread_id) {
      const t = await api(`/v1/threads/${encodeURIComponent(m.thread_id)}?source=${encodeURIComponent(m.source)}&limit=2000`);
      renderConversation(`${badge(m.source)} ${esc(m.thread_id)}`, `${t.messages.length} messages${t.truncated ? " (truncated)" : ""}`, t.messages, m.id);
    } else {
      const d = await api(`/v1/messages/${m.id}`);
      renderConversation(`${badge(d.source)} ${esc(d.sender)}`, fmtDay(d.sent_at), [d], null);
    }
  } catch (err) { $("#detail").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

/* ---------- views ---------- */

const controls = {
  search: () => `
    <div class="row"><input id="q" placeholder="Search the archive… (Enter)" autofocus></div>
    <div class="row filters">
      <select id="f-source"><option value="">all sources</option>${stats.map(s => `<option>${esc(s.source)}</option>`).join("")}</select>
      <input id="f-from" placeholder="sender">
      <input id="f-since" type="date"><input id="f-until" type="date">
    </div>`,
  browse: () => `
    <div class="row filters">
      <select id="f-source"><option value="">all sources</option>${stats.map(s => `<option>${esc(s.source)}</option>`).join("")}</select>
      <select id="f-order"><option value="desc">newest first</option><option value="asc">oldest first</option></select>
    </div>`,
  contacts: () => ``,
  stats: () => ``,
};

async function runSearch(append = false) {
  const q = $("#q").value.trim();
  if (!q) return;
  offset = append ? offset + 50 : 0;
  const p = new URLSearchParams({ q, limit: 50, offset });
  for (const [k, id] of [["source", "#f-source"], ["from", "#f-from"], ["since", "#f-since"], ["until", "#f-until"]]) {
    const v = $(id)?.value; if (v) p.set(k, v);
  }
  try {
    const items = await api(`/v1/search?${p}`);
    renderHits(items, { query: q, append, more: items.length === 50 });
  } catch (err) { $("#results").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

async function runBrowse(append = false) {
  offset = append ? offset + 100 : 0;
  const src = $("#f-source").value, order = $("#f-order").value === "asc" ? "asc" : "desc";
  const where = src ? `where source = '${src.replace(/'/g, "''")}'` : "";
  const sql = `select id, source, thread_id, sender, subject, left(body, 300) as body, sent_at
               from messages ${where} order by sent_at ${order} limit 100 offset ${offset}`;
  try {
    const res = await api("/v1/query", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sql, limit: 100 }) });
    const items = res.rows.map(r => Object.fromEntries(res.columns.map((c, i) => [c, r[i]])));
    renderHits(items, { append, more: items.length === 100 });
  } catch (err) { $("#results").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

async function runContacts() {
  try {
    const cs = await api("/v1/contacts");
    lastItems = cs;
    $("#results").innerHTML = cs.map((c, i) => `
      <div class="hit contact-row" data-i="${i}">
        <span class="sender">${esc(c.name)}</span>
        <span class="aliases">${(c.aliases || []).map(a => esc(a.value)).join(" · ")}</span>
      </div>`).join("") || `<div class="empty">No contacts yet</div>`;
  } catch (err) { $("#results").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

async function openContact(c) {
  try {
    const msgs = await api(`/v1/contacts/${encodeURIComponent(c.name)}/messages?limit=500`);
    renderConversation(esc(c.name), `${msgs.length} messages across sources`, msgs.reverse(), null);
  } catch (err) { $("#detail").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

function runStats() {
  $("#results").innerHTML = "";
  $("#detail").innerHTML = `<div class="cards">` + stats.map(s => `
    <div class="card" data-src="${esc(s.source)}">
      <div>${badge(s.source)}</div>
      <div class="n">${s.messages.toLocaleString("en")}</div>
      <div class="sub">${fmtDay(s.earliest)} → ${fmtDay(s.latest)}</div>
      <div class="sub">ingested ${fmtDay(s.last_ingest)}</div>
    </div>`).join("") + `</div>`;
  document.querySelectorAll(".card").forEach(el => el.onclick = () => {
    setView("browse"); $("#f-source").value = el.dataset.src; runBrowse();
  });
}

function loadMore() { view === "search" ? runSearch(true) : runBrowse(true); }

function setView(v) {
  view = v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  $("#controls").innerHTML = controls[v]();
  $("#results").innerHTML = "";
  if (v === "search") {
    $("#q").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
    $("#controls").querySelectorAll("select,input[type=date]").forEach(el => el.addEventListener("change", () => runSearch()));
    $("#q").focus();
  } else if (v === "browse") {
    $("#controls").querySelectorAll("select").forEach(el => el.addEventListener("change", () => runBrowse()));
    runBrowse();
  } else if (v === "contacts") runContacts();
  else if (v === "stats") runStats();
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => setView(b.dataset.view));

(async function init() {
  try {
    stats = await api("/v1/stats");
    $("#totals").textContent = stats.reduce((a, s) => a + s.messages, 0).toLocaleString("en") + " messages";
  } catch (err) {
    $("#detail").innerHTML = `<div class="empty">Cannot reach the archive: ${esc(err.message)}</div>`;
  }
  setView("search");
})();
</script>
</body>
</html>
