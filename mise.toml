[tools]
node = "24.21.0"
bun = "1.4.3"
go = "1.27.2"
golangci-lint = "2.14.0"
swiftformat = "0.63.1"
swiftlint = { version = "0.65.1", os = ["linux", "macos"] }
xcodegen = "2.46.0"

[env]
AQT_VPS_HOST = "root@ubuntu"

[vars]
gallery_vps_root = "/srv/docker/aqt-gallery"
tracker_vps_root = "/opt/aqt-tracker"

[task_config]
includes = ["tools/tasks"]

[tasks."vps:auth"]
description = "Pass the Tailscale SSH check for the VPS, opening the login URL if one is needed"
run = "ops/vps.sh $AQT_VPS_HOST"

[tasks.check]
description = "Every app's checks, with shared tasks run once"
depends = ["*:check"]

[tasks."ts:check"]
description = "Lint, format check, typecheck and test every TypeScript project"
depends = ["*:ts"]

[tasks."workspace:check"]
description = "Check workspace configuration types and formatting"
run = [
  "bunx --no-install vp fmt --check . \"!apps/**\" \"!packages/**\" \"!tools/stack/**\"",
  "bunx --no-install tsc --noEmit",
]

[tasks."shared:ts"]
run = ["bunx --no-install vp check packages", "bun run --filter \"./packages/ts/*\" typecheck"]

[tasks."shared:go"]
description = "Vet, test and lint the Go packages that apps build against"
dir = "packages/go/extract"
run = ["go vet ./...", "go test -race ./...", "golangci-lint run"]
# The race detector needs cgo, which Windows only has with a C compiler installed.
run_windows = ["go vet ./...", "go test ./...", "golangci-lint run"]

[tasks."stack:check"]
depends = ["shared:ts", "stack:ts"]

[tasks."stack:ts"]
run = [
  "bunx --no-install vp check tools/stack",
  "bun run --cwd tools/stack typecheck",
  "bun run --cwd tools/stack test",
]

[tasks."bank:check"]
depends = ["shared:ts", "shared:go", "bank:ts", "bank:go"]

[tasks."bank:ts"]
run = [
  "bunx --no-install vp check apps/bank",
  "bun run --filter \"@aqt/bank-*\" typecheck",
  "bun run --cwd apps/bank/internal/webui/app test",
  "bun run --cwd apps/bank/internal/webui/app check:dist",
]

[tasks."bank:go"]
dir = "apps/bank"
# Without the workspace, as the image builds.
env = { GOWORK = "off" }
run = ["go mod tidy -diff", "go vet ./...", "go test -race ./...", "golangci-lint run"]

[tasks."bank:dev"]
dir = "apps/bank"
run = "go run ./cmd/bank serve"

[tasks."gallery:check"]
depends = ["shared:ts", "gallery:ts"]

[tasks."gallery:ts"]
run = [
  "bun run --cwd apps/gallery check",
  "bun run --cwd apps/gallery typecheck",
  "bun run --cwd apps/gallery test",
]

[tasks."gallery:deploy"]
description = "Pull, rebuild and restart the API server on the VPS"
env = { AQT_VPS_ROOT = "{{vars.gallery_vps_root}}" }
run = "ops/deploy.sh gallery/apps/server"

[tasks."gallery:secrets:send"]
description = "Write the prod .env from Infisical onto the VPS"
env = { AQT_VPS_ROOT = "{{vars.gallery_vps_root}}" }
run = "ops/secrets.sh send gallery prod"

[tasks."gallery:dev"]
dir = "apps/gallery"
run = "bun run dev"

[tasks."tracker:deploy"]
description = "Pull, rebuild and restart the tracker server on the VPS"
env = { AQT_VPS_ROOT = "{{vars.tracker_vps_root}}" }
run = "ops/deploy.sh tracker"

[tasks."tracker:secrets:send"]
description = "Write the prod .env from Infisical onto the VPS"
env = { AQT_VPS_ROOT = "{{vars.tracker_vps_root}}" }
run = "ops/secrets.sh send tracker prod"

[tasks."img:check"]
depends = ["shared:ts", "img:ts"]

[tasks."img:ts"]
run = ["bunx --no-install vp check apps/img", "bun run --filter \"@aqt/img*\" typecheck"]

[tasks."img:dev"]
dir = "apps/img"
run = "bun run dev"

[tasks."notch:check"]
depends = ["notch:lint", "notch:test"]

[tasks."notch:lint"]
run = [
  "swiftformat --lint apps/notch",
  "swiftlint lint --strict --quiet apps/notch",
  "bunx --no-install vp fmt --check apps/notch",
]

[tasks."notch:test"]
dir = "apps/notch"
run = [
  "xcodegen generate",
  "xcodebuild -project Notch.xcodeproj -scheme NotchTests -destination platform=macOS -derivedDataPath DerivedData -quiet test",
  "swift test --package-path Packages/NotchCore",
]

[tasks."notch:dev"]
dir = "apps/notch"
run = "./run.sh --run"

[tasks."starboard:check"]
depends = ["starboard:lint", "starboard:test"]

[tasks."starboard:lint"]
run = [
  "swiftformat --lint apps/starboard",
  "swiftlint lint --strict --quiet apps/starboard",
  "bunx --no-install vp fmt --check apps/starboard",
]

[tasks."starboard:test"]
dir = "apps/starboard"
run = [
  "swift test --package-path Packages/StarboardCore",
  "xcodegen generate --quiet",
  "xcodebuild -project Starboard.xcodeproj -scheme Starboard -destination platform=macOS -derivedDataPath DerivedData -quiet build CODE_SIGNING_ALLOWED=NO",
]

[tasks."starboard:dev"]
dir = "apps/starboard"
run = "./run.sh --run"

[tasks."starboard:install"]
dir = "apps/starboard"
run = "./run.sh --install"
