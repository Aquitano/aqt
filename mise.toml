[tools]
bun = "1.4.2"
go = "1.27.1"
java = "temurin-25"
golangci-lint = "2.13.2"
swiftformat = "0.63.0"
swiftlint = "0.65.1"
xcodegen = "2.46.0"

[env]
AQT_VPS_HOST = "root@ubuntu"

[vars]
gallery_vps_root = "/srv/docker/aqt-gallery"
tracker_vps_root = "/opt/aqt-tracker"

[task_config]
includes = ["tools/tasks"]

[tasks."vps:auth"]
description = "Pass the Tailscale SSH check for the VPS, opening the login URL if one is needed"
run = "ops/vps.sh $AQT_VPS_HOST"

[tasks.check]
description = "Every app's checks, with shared tasks run once"
depends = ["*:check"]

[tasks."ts:check"]
description = "Lint, format check, typecheck and test every TypeScript project"
depends = ["*:ts"]

[tasks."workspace:check"]
description = "Format check workspace configuration and documentation"
run = "bunx --no-install oxfmt --check . '!apps/**' '!packages/**' '!tools/stack/**'"

[tasks."shared:ts"]
run = [
  "bunx --no-install oxlint --type-aware packages/ts",
  "bunx --no-install oxfmt --check packages",
  "bun run --filter './packages/ts/*' typecheck",
]

[tasks."stack:check"]
depends = ["shared:ts", "stack:ts"]

[tasks."stack:ts"]
run = [
  "bunx --no-install oxlint --type-aware tools/stack",
  "bunx --no-install oxfmt --check tools/stack",
  "bun run --cwd tools/stack typecheck",
  "bun run --cwd tools/stack test",
]

[tasks."bank:check"]
depends = ["shared:ts", "bank:ts", "bank:go"]

[tasks."bank:ts"]
run = [
  "bunx --no-install oxlint --type-aware apps/bank",
  "bunx --no-install oxfmt --check apps/bank",
  "bun run --filter '@aqt/bank-*' typecheck",
]

[tasks."bank:go"]
dir = "apps/bank"
run = ["go vet ./...", "go test -race ./...", "golangci-lint run"]

[tasks."bank:dev"]
dir = "apps/bank"
run = "go run ./cmd/bank serve"

[tasks."health:check"]
description = "Needs Docker or AQT_HEALTH_TEST_JDBC_URL"
depends = ["shared:ts", "health:ts", "health:kotlin"]

[tasks."health:ts"]
run = [
  "bun run --cwd apps/health/frontend lint",
  "bunx --no-install oxfmt --check apps/health",
  "bun run --cwd apps/health/frontend typecheck",
  "bun run --cwd apps/health/frontend test",
]

[tasks."health:kotlin"]
dir = "apps/health"
run = "./gradlew check --continue"

[tasks."health:dev"]
depends = ["health:dev:api", "health:dev:web"]

[tasks."health:dev:api"]
dir = "apps/health"
run = "./gradlew run"

[tasks."health:dev:web"]
dir = "apps/health/frontend"
run = "bun run dev"

[tasks."gallery:check"]
depends = ["shared:ts", "gallery:ts"]

[tasks."gallery:ts"]
run = [
  "bun run --cwd apps/gallery check",
  "bunx --no-install oxfmt --check apps/gallery",
  "bun run --cwd apps/gallery typecheck",
  "bun run --cwd apps/gallery test",
]

[tasks."gallery:deploy"]
description = "Pull, rebuild and restart the API server on the VPS"
env = { AQT_VPS_ROOT = "{{vars.gallery_vps_root}}" }
run = "ops/deploy.sh gallery/apps/server"

[tasks."gallery:secrets:send"]
description = "Write the prod .env from Infisical onto the VPS"
env = { AQT_VPS_ROOT = "{{vars.gallery_vps_root}}" }
run = "ops/secrets.sh send gallery prod"

[tasks."gallery:dev"]
dir = "apps/gallery"
run = "bun run dev"

[tasks."tracker:deploy"]
description = "Pull, rebuild and restart the tracker server on the VPS"
env = { AQT_VPS_ROOT = "{{vars.tracker_vps_root}}" }
run = "ops/deploy.sh tracker"

[tasks."tracker:secrets:send"]
description = "Write the prod .env from Infisical onto the VPS"
env = { AQT_VPS_ROOT = "{{vars.tracker_vps_root}}" }
run = "ops/secrets.sh send tracker prod"

[tasks."img:check"]
depends = ["shared:ts", "img:ts"]

[tasks."img:ts"]
run = [
  "bun run --cwd apps/img lint",
  "bunx --no-install oxfmt --check apps/img",
  "bun run --filter '@aqt/img*' typecheck",
]

[tasks."img:dev"]
dir = "apps/img"
run = "bun run dev"

[tasks."notch:check"]
depends = ["notch:lint", "notch:test"]

[tasks."notch:lint"]
run = [
  "swiftformat --lint apps/notch",
  "swiftlint lint --strict --quiet apps/notch",
  "bunx --no-install oxfmt --check apps/notch",
]

[tasks."notch:test"]
dir = "apps/notch"
run = [
  "xcodegen generate",
  "xcodebuild -project Notch.xcodeproj -scheme NotchTests -destination platform=macOS -derivedDataPath DerivedData -quiet test",
  "swift test --package-path Packages/NotchCore",
]

[tasks."notch:dev"]
dir = "apps/notch"
run = "./run.sh --run"

[tasks."starboard:check"]
depends = ["starboard:lint", "starboard:test"]

[tasks."starboard:lint"]
run = [
  "swiftformat --lint apps/starboard",
  "swiftlint lint --strict --quiet apps/starboard",
  "bunx --no-install oxfmt --check apps/starboard",
]

[tasks."starboard:test"]
dir = "apps/starboard"
run = "make test"

[tasks."starboard:dev"]
dir = "apps/starboard"
run = "./run.sh --run"
