name: attic
on:
  push:
    branches: [main]
    paths:
      [
        "apps/attic/**",
        "packages/go/extract/**",
        "packages/go/pgschema/**",
        ".golangci.yml",
        "mise.toml",
        "tools/tasks/attic.toml",
        ".github/workflows/attic.yml",
      ]
  pull_request:
    paths:
      [
        "apps/attic/**",
        "packages/go/extract/**",
        "packages/go/pgschema/**",
        ".golangci.yml",
        "mise.toml",
        "tools/tasks/attic.toml",
        ".github/workflows/attic.yml",
      ]
permissions:
  contents: read
concurrency:
  group: attic-${{ github.ref }}
  cancel-in-progress: true
env:
  # Otherwise mise run installs every tool in mise.toml, not only the ones the job asked for.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # pg_search 0.26.1, also used by the local Compose stack.
        image: paradedb/paradedb:v0.26.1-pg18@sha256:29bd8cc90a89ff15f8350f89b4849c2ef807aa9381c79febd1afb1a8a25fb706
        env:
          POSTGRES_USER: attic
          POSTGRES_PASSWORD: attic
          POSTGRES_DB: attic
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U attic -d attic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://attic:attic@localhost:5436/attic?sslmode=disable
      ATTIC_TEST_DATABASE_URL: postgres://attic:attic@localhost:5436/attic?sslmode=disable
      # attic:check runs shared:go, whose migration tests need a server too.
      PGSCHEMA_TEST_DATABASE_URL: postgres://attic:attic@localhost:5436/attic?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl tesseract-ocr poppler-utils
      - run: mise run attic:check

  # Windows minutes bill at 2x, so this job waits for main.
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - run: go test ./apps/attic/internal/disk ./apps/attic/internal/archive ./apps/attic/internal/scratch ./apps/attic/internal/process
