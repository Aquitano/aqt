name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bun run check-types

      - name: Build
        run: bun run build
        # Builds only bundle code; no real services are reached. Supply
        # schema-satisfying placeholders so @t3-oss/env validation passes.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          CLERK_SECRET_KEY: sk_test_ci_placeholder_not_used
          CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder_not_used
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder_not_used
          SERVER_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          VITE_SERVER_URL: http://localhost:3000
          NODE_ENV: production
