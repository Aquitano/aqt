name: tracker
on:
  push:
    branches: [main]
    paths:
      [
        "apps/tracker/**",
        "packages/go/pgschema/**",
        ".golangci.yml",
        "mise.toml",
        "tools/tasks/tracker.toml",
        ".github/workflows/tracker.yml",
      ]
  pull_request:
    paths:
      [
        "apps/tracker/**",
        "packages/go/pgschema/**",
        ".golangci.yml",
        "mise.toml",
        "tools/tasks/tracker.toml",
        ".github/workflows/tracker.yml",
      ]
permissions:
  contents: read
concurrency:
  group: tracker-${{ github.ref }}
  cancel-in-progress: true
env:
  # Otherwise mise run installs every tool in mise.toml, not only the ones the job asked for.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # The image apps/tracker/docker-compose.yml pins.
        image: paradedb/paradedb:v0.26.1-pg18@sha256:29bd8cc90a89ff15f8350f89b4849c2ef807aa9381c79febd1afb1a8a25fb706
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tracker -d tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRACKER_TEST_DATABASE_URL: postgres://tracker:tracker@localhost:5435/tracker?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint
      - run: mise run tracker:go
