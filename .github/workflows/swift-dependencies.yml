name: swift-dependencies
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun tools/stack/src/check-swift-dependencies.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
