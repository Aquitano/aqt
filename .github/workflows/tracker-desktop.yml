name: tracker-desktop
# macOS minutes bill at 10x, so this runs after merge to main, or on demand for a branch.
on:
  push:
    branches: [main]
    paths:
      [
        "apps/tracker/desktop/**",
        "tools/macos-app.sh",
        ".swiftformat",
        ".swiftlint.yml",
        ".swiftlint-baseline.json",
        "mise.toml",
        "tools/tasks/tracker.toml",
        ".github/workflows/tracker-desktop.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tracker-desktop-${{ github.ref }}
  cancel-in-progress: true
env:
  # Otherwise mise run installs every tool in mise.toml, not only the ones the job asked for.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
jobs:
  check:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: swiftformat swiftlint xcodegen
      - run: mise run tracker:swift
      - run: mise run tracker:desktop:test
      - run: >-
          xcodebuild -project TrackerAgent.xcodeproj -scheme TrackerAgent -configuration Debug
          -destination platform=macOS -derivedDataPath DerivedData -quiet build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/tracker/desktop
