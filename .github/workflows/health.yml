name: health
on:
  push:
    branches: [main]
    paths: ["apps/health/**", "!apps/health/frontend/**", ".github/workflows/health.yml"]
  pull_request:
    paths: ["apps/health/**", "!apps/health/frontend/**", ".github/workflows/health.yml"]
permissions:
  contents: read
concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/health
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aqt_health
          POSTGRES_USER: aqt_health
          POSTGRES_PASSWORD: aqt_health
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqt_health -d aqt_health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AQT_HEALTH_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/aqt_health
      AQT_HEALTH_TEST_DB_USER: aqt_health
      AQT_HEALTH_TEST_DB_PASSWORD: aqt_health
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew check --continue
