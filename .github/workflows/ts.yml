name: ts
on:
  push:
    branches: [main]
    paths:
      [
        "packages/ts/**",
        "apps/attic/executor/**",
        "apps/gallery/**",
        "apps/img/**",
        "apps/bank/internal/webui/app/**",
        "apps/bank/scripts/**",
        "apps/tracker/extension/**",
        "tools/**",
        "vite.config.ts",
        "tsconfig.json",
        "package.json",
        "bun.lock",
        "mise.toml",
        ".github/workflows/ts.yml",
      ]
  pull_request:
    paths:
      [
        "packages/ts/**",
        "apps/attic/executor/**",
        "apps/gallery/**",
        "apps/img/**",
        "apps/bank/internal/webui/app/**",
        "apps/bank/scripts/**",
        "apps/tracker/extension/**",
        "tools/**",
        "vite.config.ts",
        "tsconfig.json",
        "package.json",
        "bun.lock",
        "mise.toml",
        ".github/workflows/ts.yml",
      ]
permissions:
  contents: read
concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true
env:
  # Otherwise mise run installs every tool in mise.toml, not only the ones the job asked for.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
jobs:
  # Turnstash's TypeScript task needs ParadeDB and runs in the turnstash workflow.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun node
      - run: bun install --frozen-lockfile
      - run: mise run workspace:check
      - run: mise run shared:ts
      - run: mise run attic:ts
      - run: mise run stack:ts
      - run: mise run bank:ts
      - run: mise run gallery:ts
      - run: mise run img:ts
      - run: mise run tracker:ts
