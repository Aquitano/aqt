name: ts
on:
  push:
    branches: [main]
    paths:
      [
        "packages/ts/**",
        "apps/gallery/**",
        "apps/img/**",
        "apps/bank/internal/webui/app/**",
        "apps/tracker/extension/**",
        "tools/**",
        ".oxlintrc.json",
        ".oxfmtrc.json",
        "package.json",
        "bun.lock",
        ".github/workflows/ts.yml",
      ]
  pull_request:
    paths:
      [
        "packages/ts/**",
        "apps/gallery/**",
        "apps/img/**",
        "apps/bank/internal/webui/app/**",
        "apps/tracker/extension/**",
        "tools/**",
        ".oxlintrc.json",
        ".oxfmtrc.json",
        "package.json",
        "bun.lock",
        ".github/workflows/ts.yml",
      ]
permissions:
  contents: read
concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run --filter aqt-gallery test
      - run: bun run --filter @aqt/stack test
