name: bank
on:
  push:
    branches: [main]
    paths:
      [
        "apps/bank/**",
        "packages/go/extract/**",
        "packages/go/pgschema/**",
        ".golangci.yml",
        "mise.toml",
        ".github/workflows/bank.yml",
      ]
  pull_request:
    paths:
      [
        "apps/bank/**",
        "packages/go/extract/**",
        "packages/go/pgschema/**",
        ".golangci.yml",
        "mise.toml",
        ".github/workflows/bank.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bank-${{ github.ref }}
  cancel-in-progress: true
env:
  # Otherwise mise run installs every tool in mise.toml, not only the ones the job asked for.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # pg_search 0.26.4, also used by the local Compose stack.
        image: paradedb/paradedb:v0.26.4-pg18@sha256:4abbafffb4e59e679821c5882faf91c494022bb3242fc73b789e753f43df1361
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: bank
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bank -d bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BANK_TEST_DATABASE_URL: postgres://bank:bank@localhost:5433/bank?sslmode=disable
      ATTIC_TEST_DATABASE_URL: postgres://bank:bank@localhost:5433/bank?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint
      # attic's extraction tests call these tools.
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl tesseract-ocr poppler-utils
      - run: "mise run bank:go ::: bank:go:unix ::: bank:go:windows"

  # Windows minutes bill at 2x, so this job waits for main or a manual run.
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/bank
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - run: go test ./internal/attic/disk ./internal/attic/archive ./internal/attic/scratch ./internal/attic/process ./internal/attic/dedupe ./internal/attic/organize
