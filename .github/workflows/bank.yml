name: bank
on:
  push:
    branches: [main]
    paths: ["apps/bank/**", ".golangci.yml", ".github/workflows/bank.yml"]
  pull_request:
    paths: ["apps/bank/**", ".golangci.yml", ".github/workflows/bank.yml"]
permissions:
  contents: read
concurrency:
  group: bank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bank
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bank/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: apps/bank
      - run: go vet ./...
      - run: go test -race ./...
