name: bank
on:
  push:
    branches: [main]
    paths: ["apps/bank/**", ".golangci.yml", ".github/workflows/bank.yml"]
  pull_request:
    paths: ["apps/bank/**", ".golangci.yml", ".github/workflows/bank.yml"]
permissions:
  contents: read
concurrency:
  group: bank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # pg_search 0.25.6, also used by the local Compose stack.
        image: paradedb/paradedb@sha256:c5b04eba22497fa25de12265692e9578e309c2e2001d023ce6d08a17226c200a
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: bank
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bank -d bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://bank:bank@localhost:5433/bank?sslmode=disable
      BANK_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: apps/bank
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bank/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: apps/bank
      - run: go vet ./...
      - run: go test -race ./...
