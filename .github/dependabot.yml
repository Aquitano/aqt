version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      tooling:
        patterns:
          [
            "oxlint*",
            "oxfmt",
            "typescript",
            "@types/*",
            "@typescript/*",
            "vite",
            "@vitejs/*",
            "@vitest/*",
            "vitest",
            "wrangler",
            "@cloudflare/*",
            "@rolldown/*",
            "babel-plugin-react-compiler",
          ]
        update-types: [minor, patch]
      effect:
        patterns: ["effect", "@effect/*"]
        update-types: [minor, patch]
      runtime:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories: [/apps/attic, /apps/bank, /apps/tracker, /packages/go/extract]
    schedule: { interval: weekly }
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/apps/bank, /apps/tracker, /apps/gallery/apps/server, /apps/turnstash/deploy]
    schedule: { interval: weekly }
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directories:
      [
        /apps/bank,
        /apps/attic,
        /apps/tracker,
        /apps/tracker/deploy,
        /apps/gallery/apps/server,
        /apps/turnstash/deploy,
      ]
    schedule: { interval: weekly }
    groups:
      compose:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
