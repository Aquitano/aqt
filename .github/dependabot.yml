version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Gallery and img move from drizzle 0.x to 1.0 by hand once 1.0 is stable; a version range
      # did not stop Dependabot from proposing turnstash's release candidate for them.
      - dependency-name: "drizzle-*"
        update-types: ["version-update:semver-major"]
      # vite-plus and its vite alias move together by hand; see the README's dependency updates.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
    groups:
      tooling:
        patterns:
          [
            "typescript",
            "@types/*",
            "@typescript/*",
            "@vitejs/*",
            "wrangler",
            "@cloudflare/*",
            "@rolldown/*",
            "babel-plugin-react-compiler",
          ]
        update-types: [minor, patch]
      effect:
        patterns: ["effect", "@effect/*"]
        update-types: [minor, patch]
      runtime:
        patterns: ["*"]
        update-types: [minor, patch]
      major:
        patterns: ["*"]
        update-types: [major]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: [/apps/attic, /apps/bank, /apps/tracker, /packages/go/extract]
    schedule: { interval: weekly }
    groups:
      go:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/apps/bank, /apps/tracker, /apps/gallery/apps/server, /apps/turnstash/deploy]
    schedule: { interval: weekly }
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories:
      [
        /apps/bank,
        /apps/attic,
        /apps/tracker,
        /apps/tracker/deploy,
        /apps/gallery/apps/server,
        /apps/turnstash/deploy,
      ]
    schedule: { interval: weekly }
    groups:
      compose:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
