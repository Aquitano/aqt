version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups: { typescript: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /apps/attic
    schedule: { interval: weekly }
    groups: { attic-go: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /apps/bank
    schedule: { interval: weekly }
    groups: { bank-go: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /apps/tracker
    schedule: { interval: weekly }
    groups: { tracker-go: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /packages/go/extract
    schedule: { interval: weekly }
    groups: { extract-go: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /apps/bank
    schedule: { interval: weekly }
    groups: { bank-docker: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /apps/gallery/apps/server
    schedule: { interval: weekly }
    groups: { gallery-docker: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
