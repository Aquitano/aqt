version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups: { typescript: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /apps/bank
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /apps/health
    schedule: { interval: weekly }
    # Dependabot names the kotlin("jvm") plugin "jvm"; the Kotlin plugins and stdlib must move together
    groups: { kotlin: { patterns: ["org.jetbrains.kotlin*", "jvm"] } }
  - package-ecosystem: docker
    directory: /apps/bank
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/health
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
