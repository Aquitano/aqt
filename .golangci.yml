version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (net/http.ResponseWriter).Write
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Conn).Release
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close
        - (*net/http.Server).Close
        - (*net/http.Server).Shutdown
        - golang.org/x/sys/windows.CloseHandle
        - (*golang.org/x/sys/windows.LazyProc).Call
  exclusions:
    rules:
      - linters: [errcheck]
        text: 'Error return value of `[^`]*\.Close` is not checked'
      - linters: [errcheck]
        path: _test\.go
      - linters: [staticcheck]
        text: ST1005
formatters:
  enable:
    - gofmt
