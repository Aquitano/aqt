name: Notch
options:
  bundleIdPrefix: com.aquitano
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "" # set your Developer-ID team for local signing
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Notch:
    type: application
    platform: macOS
    sources:
      - path: Notch
        excludes:
          - "**/*.md"
    dependencies:
      # Embed the standalone hook tool so the launcher can exec it instead of
      # the full app (a few ms vs. loading AppKit/SwiftUI per hook).
      - target: notch-hook
        link: false
        embed: true
        codeSign: true
        copy:
          destination: resources
    settings:
      base:
        PRODUCT_NAME: Notch
        PRODUCT_BUNDLE_IDENTIFIER: com.aquitano.notch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Notch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Notch/Notch.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Standalone agent hook client. Foundation-only, no AppKit — the launcher in
  # ~/.notch/bin execs this per hook. Shares HookClient/HookEnvelope with the app.
  notch-hook:
    type: tool
    platform: macOS
    sources:
      - path: Notch/Model/Agents/AgentModels.swift
      - path: Notch/Services/Agents/AgentSocketPath.swift
      - path: Notch/App/HookClient.swift
      - path: HookTool
    settings:
      base:
        PRODUCT_NAME: notch-hook
        PRODUCT_BUNDLE_IDENTIFIER: com.aquitano.notch.hook
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: YES

    # The mediaremote-adapter system-wide Now Playing bridge is an opt-in.
    # To enable it: uncomment the package below + the dependency, then read
    # README.md "Enabling system-wide Now Playing". The code is guarded by
    # #if canImport(MediaRemoteAdapter), so leaving it out changes nothing.
    # dependencies:
    #   - package: mediaremote-adapter

  # Logic tests for the agent-watch pure modules. Host-less: the modules under
  # test are Foundation-only and compiled straight into the bundle (same pattern
  # as notch-hook reusing AgentModels), so the suite runs without launching the
  # app — no AppKit, no TCC prompts.
  NotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Notch/Model/Agents/AgentModels.swift
      - path: Notch/Model/Agents/ScannedSession.swift
      - path: Notch/Services/Agents/StatusReducer.swift
      - path: Notch/Services/Agents/TranscriptParser.swift
      - path: Notch/Services/Agents/SessionReconciler.swift
      - path: Notch/Services/Agents/AgentConfigInstaller.swift
      - path: Notch/Managers/Widgets/BatteryPolicy.swift
      - path: Notch/Managers/Widgets/CalendarReminders.swift
      - path: Notch/Model/Activity.swift
      - path: Notch/Model/SystemModels.swift
      - path: Notch/Window/HitRegion.swift
      - path: Notch/State/Animations.swift
      - path: Notch/State/NotchState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aquitano.notch.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO

schemes:
  NotchTests:
    build:
      targets:
        NotchTests: [test]
    test:
      targets:
        - NotchTests

